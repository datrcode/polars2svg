[build-system]
# >=1.27 is the floor for PEP 639 `license`/`license-expression` handling below;
# an older hatchling emits legacy metadata or fails outright.  The 0.2.0 wheel was
# built with 1.31.0.
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name            = "polars2svg"
version         = "0.3.1"
authors         = [{ name = "D. Trimm", email = "dave.trimm+polars2svg@gmail.com" }]
description     = "Visualization Package Leveraging Polars and SVG in Jupyter Notebooks"
readme          = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license         = "Apache-2.0"
# NOTICE ships too: Apache-2.0 §4(d) requires a redistributed work to carry the
# NOTICE file's contents, and the wheel is the redistribution most users get.  It
# also carries the bundled third-party attributions -- Noto Sans (OFL 1.1) and the
# ColorBrewer Spectral palette, whose licence requires attribution.  Both land in
# dist-info/licenses/.  Audit 20260915 H3; the sdist already had NOTICE.
license-files   = ["LICENSE", "NOTICE"]
keywords        = ["polars", "svg", "visualization", "jupyter", "dataframe", "charts"]
# Lower bounds are recent, py3.12-compatible floors with headroom below the
# versions pinned in uv.lock (the known-good set). They guard against an install
# resolving an ancient release while staying wide enough to avoid downstream
# dependency conflicts. Exception: pillow's floor is security-driven, not a
# compatibility floor — 12.3 is the first release fixing PYSEC-2026-2253..2257,
# so it sits at the locked version with no headroom on purpose.  polars is the
# other exception: 1.36 is a *measured* minimum, not a floor with headroom.  The
# suite was stepped across releases against the declared floors (PLANNING.md R8,
# 2026-09-17) and fails 95 tests at 1.25-1.33 and 6 at 1.35.2, reaching 0 only at
# 1.36.  Dominant cause is `dt.total_seconds(fractional=True)`, absent below 1.35,
# which every dated or datetime xyp axis calls; 1.36 is also the first release
# with `explode(empty_as_null=)`.  Do not lower it without re-running that sweep.
#
# Core is deliberately slim: xyp/histop/timep/piep/smallp/spreadlinesp only need
# polars + numpy (+ pyarrow/pillow/platformdirs for I/O). linkp's/chordp's
# pluggable-layout algorithms, the graph-layout mixin (treemaps, force-directed,
# neighborhood clustering, ...), and shapely-typed background= shapes all live
# behind the `layouts` extra instead — see p2s_graph_mixin.py / chordp.py /
# xyp.py / linkp.py, each of which guards its heavy import and raises a clear
# ImportError naming `polars2svg[layouts]` if the feature is actually used
# without it. Interactive variants (panelize/xypi/histopi/.../linkpi) similarly
# live behind `interactive`. `pip install polars2svg[all]` restores the
# previous "batteries included" install.
dependencies    = [
  "numpy>=1.26",
  "polars>=1.36",
  "pyarrow>=16",
  "pillow>=12.3",
  "platformdirs>=4.0",
]

classifiers=[
"Development Status :: 4 - Beta",
"Intended Audience :: Science/Research",
"Framework :: Jupyter",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
# 3.14 added 2026-09-14, only after the whole suite ran green on 3.14.5 -- the main
# suite (3461 passed, matching 3.13 exactly) and the 219-test interaction suite.
# requires-python already admitted it, so users were installing there regardless.
"Programming Language :: Python :: 3.14",
"Operating System :: OS Independent",
# The package ships a py.typed marker and every module is annotated; PyPI users
# filter on this trove classifier to find typed packages.
"Typing :: Typed",
"Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# TFDPLayout (tfdp_layout.py) — t-FDP force-directed graph layout on the MLX GPU.
# It also imports scipy/networkx/scikit-learn, so it chains `layouts`; without that
# chain `pip install polars2svg[mlx]` resolves but the module cannot import.
# ODFlowLayout (od_flow_layout.py) also uses this extra: it runs on NumPy by
# default and auto-uses the MLX GPU for its O(N^2) force kernels when present.
#
# `mlx` is a front-end that ships no backend library; the backend is a separate
# distribution selected by one of mlx's own extras. On macOS `mlx` depends on mlx-metal
# UNCONDITIONALLY (`platform_system == "Darwin"` in its metadata), which is why plain
# `mlx` works there and why nobody noticed. Everywhere else it pulls NOTHING: the extra
# installs and `import mlx.core` then fails with a missing libmlx.so. So Linux picks a
# backend explicitly — `mlx-cpu` here, or the CUDA pair below.
#
# Windows cannot be fixed from this file: mlx 0.32.2 publishes win_amd64/win_arm64
# FRONT-END wheels but gates every backend distribution to Linux or Darwin, so
# `polars2svg[mlx]` and `[all]` install there and TFDPLayout still cannot run. The
# ImportError in tfdp_layout.py says so rather than naming an extra that won't help.
#
# `all` deliberately chains plain `mlx` and NEVER a backend. Every backend ships the
# same `mlx/lib/libmlx.so`, so two in one environment is last-one-installed-wins with
# no warning from pip or uv (measured 2026-08-28: mlx-cpu's 20MB library overwrote
# mlx-cuda-13's 142MB one, leaving a CUDA install running on CPU). Chaining a backend
# into `all` would make the documented `polars2svg[all,mlx-cuda13]` a coin flip;
# chaining none keeps that combination exact. See PLANNING.md R6.
#
# MLX's CUDA backend is exposed here as the explicit `mlx-cuda`
# (CUDA 12) / `mlx-cuda13` (CUDA 13) extras — explicit because the CUDA wheels are
# Linux-only and must not be resolved on macOS. The same tfdp_layout.py code runs on
# every backend; only the device MLX binds to changes. All three Linux backend extras
# resolve to nothing on macOS (their marker excludes it), so `mlx` stays the macOS answer.
#
# The CUDA backend needs: NVIDIA SM >= 7.5 (Turing+), driver >= 550.54.14 (>= 580 for
# CUDA 13), CUDA toolkit >= 12.0, glibc >= 2.35, Linux x86_64/aarch64. There are no
# Windows CUDA wheels. Off that envelope MLX falls back to CPU (TFDPLayout still
# works, just slower) — see _default_device() in tfdp_layout.py.
mlx        = ["mlx", "polars2svg[layouts]"]
mlx-cpu    = ["mlx[cpu]; sys_platform == 'linux'", "polars2svg[layouts]"]
mlx-cuda   = ["mlx[cuda12]; sys_platform == 'linux'", "polars2svg[layouts]"]
mlx-cuda13 = ["mlx[cuda13]; sys_platform == 'linux'", "polars2svg[layouts]"]

# PNG export (component.save('x.png') / .savePNG()). Pillow is already a core
# dependency; svglib+reportlab do the SVG->PNG rasterization, rlPyCairo is the
# renderPM backend needed on Linux. Install with: pip install polars2svg[export]
#
# svglib is capped below 2.0: svglib 2.x applies CSS px->pt conversion to the
# SVG's width/height (200px -> 150pt), which at renderPM's default 72dpi shrinks
# every export to 0.75 scale and mis-scales nested <svg> tiles (smallp /
# spreadlinesp). svglib 1.x carries px straight through as points (1px -> 1px at
# 72dpi), which is the rasterization the PNG goldens are validated against. See
# svgToPNGBytes() in export.py. reportlab 5 is fine with svglib 1.x, so the
# floor stays open to it (reportlab>=4.0 now admits 5.0) — the cap is on svglib.
export = ["svglib>=1.5,<2", "reportlab>=4.0", "rlPyCairo>=0.3"]

# Graph-layout algorithms: linkp's/chordp's pluggable layouts, the graph-layout
# mixin (treemaps, force-directed, neighborhood clustering, ...), and shapely
# background= shapes on xyp/linkp. chordp's node-ordering is core to every
# chord render, so chordp effectively requires this extra. Install with:
# pip install polars2svg[layouts]
layouts = ["networkx>=3.2", "scikit-learn>=1.5", "scipy>=1.13", "shapely>=2.0", "squarify>=0.4.4"]

# Interactive, cross-linked variants (panelize/xypi/histopi/timepi/linkpi/smallpi)
# built on Panel. Includes `layouts`: interactive_controller.py's graph views
# (linkpi's layout switcher, MDS/force-directed re-layout on selection) need
# networkx/scipy/scikit-learn the same as the static components do. pyperclip
# backs linkpi's ctrl-C copy-selection-to-clipboard; it's a top-level import
# in interactive_controller.py, same as panel/param, since that module is only
# ever loaded via this extra. Install with: pip install polars2svg[interactive]
interactive = ["panel>=1.5", "jupyter_bokeh>=4.0", "param>=2.0", "pyperclip>=1.9", "polars2svg[layouts]"]

# Union of every extra — restores the pre-extras "batteries included" install.
# Chains plain `mlx`, not `mlx-cuda`: `all` has to stay installable on macOS, and the
# CUDA wheels are Linux-only. NVIDIA users add it explicitly: polars2svg[all,mlx-cuda]
# Consequence of the plain-`mlx` chain, and deliberate (see the mlx comment above): on
# Linux `all` installs no usable mlx backend by itself. Combine it with exactly one
# backend extra — polars2svg[all,mlx-cpu] or polars2svg[all,mlx-cuda13] — never two.
all = ["polars2svg[interactive,layouts,export,mlx]"]

# Dev/test-only tooling (PEP 735). Not published to wheel METADATA.
# Install with: uv pip install -e . --group dev   (or `uv sync`, which includes it by default)
# svglib rasterization needs reportlab at use-time — keep them together here.
# Includes every optional extra (layouts, interactive, export) so the full test
# suite — which exercises linkp/chordp/interactive variants — runs unmodified.
[dependency-groups]
dev = [
  "pytest",
  "pytest-xdist",
  "coverage",
  # The two gate tools, pinned to a minor.  CI and tools/preflight.sh used to
  # invoke them as bare `uvx ruff` / `uvx mypy`, which resolves whatever is
  # newest into an isolated env: .ruff_cache/ accumulated nine ruff versions
  # (0.15.21 -> 0.16.7) in a few weeks, so every count recorded in PLANNING.md
  # or an audit was measured against a moving tool.  Rule sets change between
  # minors -- pin the minor, raise it deliberately.  See PLANNING.md Q1.
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<2.4",
  "fonttools",  # build-time tool for tools/gen_font_metrics.py; here so
                # tests/test_font_metrics_consistency.py can re-derive the baked
                # metrics from the bundled TTF and catch a stale generated table
                # (it skips, rather than fails, where fontTools is absent)
  "ipykernel",
  "kagglehub",
  "svglib<2",   # capped for the same reason as the [export] extra: svglib 2's
                # px->pt conversion shrinks PNG output and breaks nested-<svg>
                # goldens. Keeps local test runs on the tested rasterization path.
  "reportlab",
  "rlPyCairo",  # reportlab 5.x renderPM backend (Linux); rasterizes SVG->PNG in golden tests
]

# This group carries TEST-ONLY tooling.  It used to re-list the contents of the
# `layouts`, `interactive` and `export` extras as well, which was two copies of
# every floor and had already drifted: `svglib<2` here against `svglib>=1.5,<2`
# there, and bare `reportlab`/`rlPyCairo` against `>=4.0`/`>=0.3`.
# tools/diff_packaging_prod.sh guards dev-vs-prod, not dev-vs-itself, so nothing
# would have caught it.  Name the extras at install time instead:
#
#   VIRTUAL_ENV="$PWD/.venv" uv pip install -e '.[layouts,interactive,export]' --group dev
#   uv sync --extra layouts --extra interactive --extra export --group dev
#
# mlx stays out of both: the clean-room .venv must not have it (see CLAUDE.md),
# and .venv-mlx adds it explicitly.  svglib/reportlab/rlPyCairo remain here
# because the golden-image tests rasterize whether or not `export` is installed.

[project.urls]
Homepage   = "https://github.com/datrcode/polars2svg"
Repository = "https://github.com/datrcode/polars2svg"
Changelog  = "https://github.com/datrcode/polars2svg/blob/main/CHANGELOG.md"
Issues     = "https://github.com/datrcode/polars2svg/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser-driven suite under tests/interaction/ is opt-in: it boots a Panel
# server and drives Chromium, so it is skipped unless `--interaction` is passed
# (or P2S_INTERACTION=1 is set).  The gate lives in tests/interaction/conftest.py,
# which also applies this marker; declaring it here keeps `-m interaction` usable
# and silences PytestUnknownMarkWarning.
markers = ["interaction: browser-driven Playwright tests (require chromium)"]
# --strict-markers turns a typo'd @pytest.mark.interation into an error instead of
# a silently un-gated test that boots a browser in the default run; --strict-config
# does the same for a misspelt key in this block; xfail_strict makes an xfail that
# unexpectedly passes a failure, so a fixed bug cannot stay marked broken.
addopts      = ["--strict-markers", "--strict-config"]
xfail_strict = true

# polars2svg ships a py.typed marker so downstream type checkers read the type
# hints the package carries.  Every module in the package is annotated and
# checked with `disallow_untyped_defs`, `disallow_incomplete_defs` and
# `check_untyped_defs` package-wide, no error code disabled, plus every --strict
# flag measured at zero cost (the 2026-09-14 six, and no_implicit_reexport /
# disallow_subclassing_any from 2026-09-15).  It is NOT mypy --strict: the four
# remaining flags cost +31 / +47 / +104 / +798 as measured on 2026-09-15 and
# are adopted only through the ratchet.
#
# Run `.venv/bin/python -m mypy polars2svg`, never `uvx mypy polars2svg`: uvx
# resolves into an isolated env with no polars, numpy or PIL, so those become Any
# and the run is vacuous.  That was CI's false green until 2026-09-13
# (PLANNING.md Q1/Q4).  The resolved count now sits behind a
# ceiling in tools/preflight.sh, ci.yml and TestMypyErrorRatchet -- a floor to
# ratchet down, not a target of zero (PLANNING.md D5).  The number is kept out of
# this comment on purpose; three tested places already hold it.
#
# THE DIRECTION CHANGED TWICE, and the second change is finished.  This block
# used to say the internals were dynamically typed on purpose and that
# annotating them would be "boiling the ocean".  An audit retired that stance:
# with the setattr()-bound attribute surface simply *declared* (see the enum
# block in polars2svg.py and the per-component blocks that follow it), 72% of
# what mypy reported on this package evaporated without a single function
# signature changing.  The ocean turned out to be a pond.
#
# Two scaffolds carried the migration and are now gone (2026-09-03):
#
#   - a `disable_error_code` list that silenced seven codes tree-wide
#     (`attr-defined`, `var-annotated`, `assignment`, `has-type`, `misc`,
#     `dict-item`, `return-value`) for modules that had not graduated yet, and
#   - a `[[tool.mypy.overrides]]` ratchet that re-enabled them, module by
#     module, as each was promoted -- 3 modules at the start, 43 at the end.
#
# The settings that used to live in the ratchet are the global settings below.
# Promotion was one-way then and the floor is one-way now: do not weaken an
# annotation to satisfy this config, and do not add a module to the exemption
# beneath it.  A module that has to come off strict checking is a regression,
# not a config change.  tests/test_typing_surface.py enforces annotation
# coverage from the test suite as well, so it cannot regress where mypy is not
# run.
[tool.mypy]
python_version           = "3.12"   # the requires-python floor, not whatever .venv happens to be
files                    = ["polars2svg"]
disallow_untyped_defs    = true
disallow_incomplete_defs = true
check_untyped_defs       = true
# Added 2026-09-14 (PLANNING.md Q4 / audit F6).  Each of these cost exactly zero
# errors when measured against the then-730 baseline, so they are free to hold from
# here on; warn_unused_ignores cost four, and those four dead `# type: ignore`
# comments were removed rather than kept.
warn_unused_configs      = true
warn_redundant_casts     = true
warn_unused_ignores      = true
strict_equality          = true
extra_checks             = true
disallow_untyped_decorators = true
# Added 2026-09-15.  Costs zero against the
# 60 baseline once __init__.py's re-exports are explicit -- and it is the type-level
# half of that guard: an implicit `from .x import Y` added back to __init__.py, or
# any other module's imported name relied on from outside it, fails the package
# check here.  test_init_reexports_are_explicit is the AST half.
no_implicit_reexport     = true
# Also added 2026-09-15 (audit H4a): zero errors against the 60 baseline, so it is
# free to hold from here on.  Nothing in the package subclasses an Any-typed base
# today; this keeps it that way, since such a subclass silently disables checking
# of every member it inherits.
disallow_subclassing_any = true

# Third-party libraries that ship no type information.  This replaces a GLOBAL
# `ignore_missing_imports = true`, which silently turned every unresolved import
# into Any -- including a misspelt one -- and was the mechanism behind CI's
# vacuous green (audit F1/F5).  Verified 2026-09-14 by running mypy without the
# flag and collecting every import-untyped / import-not-found module: this list
# is exactly that set and nothing else is excused, so a typo in any OTHER import
# now fails instead of quietly becoming Any.
#
# `re._parser` / `re._constants` are CPython internals, imported by the regex
# budget guard; they are private and unstubbed by design.
#
# scipy-stubs, types-networkx and types-shapely exist on PyPI and would shrink
# this list, but each turns Any into real types and surfaces new errors -- worth
# doing against the ratchet in tests/test_typing_surface.py, not before it.
[[tool.mypy.overrides]]
module = [
  "shapely.*", "scipy.*", "networkx.*", "sklearn.*", "squarify",
  "mlx.*", "reportlab.*", "pyperclip",
  "re._parser", "re._constants",
]
ignore_missing_imports = true

# --- interactive_controller.py: permanently relaxed --------------------------
# The one module the annotation migration deliberately does not cover, decided
# 2026-09-03 rather than deferred:
#
#   - It builds its widget classes at runtime with `type('LINKPI', (ReactiveHTML,),
#     {...})`, so the classes a checker would need to reason about do not exist
#     until the call runs.
#   - Its state lives in Panel/param descriptors, which resolve dynamically.
#   - It sits behind the `interactive` extra, so it is absent from a default
#     `pip install polars2svg` and invisible to the public typed surface.
#
# Annotating it would mean a wall of `Any` and `type: ignore` for no checkable
# benefit. Its 145 functions are excluded from the coverage target (see
# TestAnnotationCoverageRatchet.PERMANENTLY_RELAXED); its ceiling still holds, so
# the file cannot get *worse*, and new code in it is still expected to be typed.
#
# This is the whole of the package's typing debt, and it is the only entry that
# may ever appear here.
[[tool.mypy.overrides]]
module = ["polars2svg.interactive_controller"]
disallow_untyped_defs    = false
disallow_incomplete_defs = false
check_untyped_defs       = false
disable_error_code = [
  "attr-defined", "var-annotated", "assignment",
  "has-type", "misc", "dict-item", "return-value",
]

# Rule set (PyPI nice-to-have #5).  The base is E9 (syntax errors) and F
# (pyflakes -- undefined names, unused imports/variables, duplicate dict keys);
# the rest was added by the 2026-09-13 tooling audit and applied in PLANNING.md
# Q3, plus B017 on 2026-09-15: assertRaises(
# Exception) passes on any exception, including a typo, and all ten sites in the
# suite now name the exception they mean.  Two of the ten were vacuous -- they
# went through a helper that already supplied the argument under test, so they
# asserted Python's own argument binding and never reached the component.
# This codebase has a distinctive style (aligned assignments, _underscore_
# locals, dynamic setattr()-bound enums) that a wider catalog would fight, so
# what is NOT here is as deliberate as what is:
#
#   E501 E701 E702  line length and one-line compound statements -- the house
#                   style.  line-length below documents the de facto width so the
#                   intent is machine-readable; E501 is still not selected.
#   N               the camelCase public API (svgToPNGBytes, recordsAt, tField).
#   I               import order.       D    docstrings (626 missing).
#   PL*             complexity metrics.  ruff format is not used at all.
#   B023            34 closures over loop variables, all read 2026-09-14: every
#                   one is defined and called inside the same iteration, the safe
#                   shape.  Enabling it buys no bug and costs 34 noqa lines.
#   BLE001 E402     deliberate broad excepts and non-top imports.  Where one
#                   carried a reason it is now a plain `# broad on purpose:`
#                   comment rather than a noqa for a rule nothing runs.
#
# Added: W (trailing/blank-line whitespace), UP (py3.12-floor modernisations),
# B006 (mutable argument defaults), the E7 comparison/lambda/ambiguous-name
# subset, and RUF100 (dead noqa directives).
[tool.ruff]
target-version = "py312"
line-length    = 160     # documents the de facto width; E501 is NOT selected

[tool.ruff.lint]
select = [
  "E9", "F", "W", "UP",
  "B006", "B017",
  "E711", "E712", "E713", "E714", "E721", "E731", "E741",
  "RUF100",
]

# No per-file-ignores.  __init__.py used to carry one for F401: its re-exports
# were the implicit `from .x import Y` form, which reads as an unused import.
# They are `Y as Y` now (2026-09-15, audit H1) -- the typing spec's explicit
# re-export idiom, which ruff recognises as a re-export and does not flag, and
# which is what makes the public API visible to pyright and mypy --strict.

[tool.coverage.run]
branch       = true
command_line = "-m unittest discover -s tests/"
# source was ["."], which put the 169 test files and tools/ in the denominator --
# the tests covering themselves.  That reported 81% where the package alone was
# 68% (measured 2026-09-12).  Nothing published the inflated number (no badge, no
# README figure, no CI consumer), so this is a straight correction.  PLANNING.md D7.
source       = ["polars2svg"]

[tool.coverage.report]
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["polars2svg"]

# Excludes working docs/tooling files that don't belong in a source release.
# README.md/LICENSE are included regardless (hatchling always ships files
# referenced by the readme/license metadata) — verified by inspecting the
# built sdist.
[tool.hatch.build.targets.sdist]
exclude = [
  "notebooks/",
  "uv.lock",
  ".python-version",
  "pypi_instructions.txt",
  "CLAUDE.md",
  "PLANNING.md",
  "20260913_fable_code_audit.md",
  "20260915_fable_code_audit.md",
  "20260917_fable_least_confidence.md",
  "20260917_fable_what_am_i_missing.md",
]
