name: Release

# Publishes polars2svg to PyPI via Trusted Publishing (OIDC) on release tags.
#
# Runs only when a tag matching v* is pushed (e.g. `git tag vX.Y.Z && git push
# origin vX.Y.Z`). The `ci` job below calls ci.yml as a reusable workflow, so
# the full suite must pass against the tagged commit before anything is built
# or published. This gate exists because a tag push does NOT trigger ci.yml on
# its own (ci.yml is push-on-main + PR), and because v0.1.1 shipped while CI
# was red on the same commit — build+publish had no test dependency at all.
#
# Trusted Publishing is registered and live (first used for v0.1.0, 2026-07-10);
# there is no API token to manage. The maintainer-only, browser-only setup is
# already done — re-registration is needed only if the repo is renamed or moved,
# at https://pypi.org/manage/account/publishing/ with workflow name `release.yml`
# and environment name `pypi`. Step-by-step release instructions live in the
# polars2svg_dev repo's pypi_instructions.txt.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Pre-publish gate: the same jobs that run on every push to main (mypy,
  # bandit/pip-audit/ruff, and the Linux clean-room wheel install + test suite),
  # executed against the tagged commit. A failure here stops the release before
  # anything is built or uploaded.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # Second half of the gate, covering the one job the `ci` call above does NOT
  # re-run: `browser-interaction` opts out of tag builds (`if: github.ref_type
  # != 'tag'` in ci.yml), so nothing in the CI gate executes the JavaScript or
  # the WGSL shaders — the keydown handlers, the picker-menu state machine, the
  # preventDefault guards, the brush, and every compute/render shader. Without
  # this job a release can publish with that entire layer unverified at the
  # tagged commit.
  #
  # It VERIFIES rather than RE-RUNS, on purpose. Re-running is the obvious fix
  # and it is the wrong trade here: a `v*` tag publishes from any branch, tags
  # are immutable under the repo rulesets, and there is no un-tagging — so a
  # single flaky browser run does not just fail a build, it burns a version
  # number that can never be reused. A lookup cannot flake. It also costs
  # seconds instead of the ~6.5 minutes the suite takes on a runner.
  #
  # What it actually asserts: that THIS commit already has a green
  # browser-interaction check run, which it will have if it went through main or
  # a PR, because ci.yml runs that job on both. The hole this closes is a tag
  # placed on a commit whose CI never ran or ran red.
  #
  # Suffix match, not equality: on a push to main the check run is named for the
  # job (`Browser interaction suite (Playwright)`), but a workflow_call prefixes
  # it with the calling job (`CI gate / Browser interaction suite (Playwright)`).
  # Matching the suffix accepts both, so this keeps working unchanged if the
  # `if:` line in ci.yml is ever deleted and the suite is promoted into the gate
  # for real. A skipped job also produces a check run — with conclusion
  # `skipped`, not `success` — so requiring `success` correctly ignores the
  # release run's own opted-out copy.
  browser-verified:
    name: Browser suite green at this commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require a successful browser-interaction run for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Browser interaction suite (Playwright)
        run: |
          set -euo pipefail

          # Bounded wait rather than a single lookup, because the common way to
          # cut a release is to push the commit and its tag together. main's
          # ci.yml and this workflow then start at the same moment, and the
          # browser job takes ~6.5 minutes — so a one-shot check would see it
          # still running and block the release over pure timing. That is the
          # one failure mode worth spending code on here: the tag is immutable,
          # so "try again in ten minutes" is not available, and recovering costs
          # a burned version number.
          #
          # 40 x 20s = ~13 minutes, comfortably past the job's runtime. Anything
          # still queued past that is not a race, it is a stuck runner.
          attempts=40

          for i in $(seq 1 "$attempts"); do
            # --paginate because a commit accumulates a check run per job per
            # workflow, and the default page of 30 can push the one we want off
            # the end once dependabot PRs and the release run itself have landed.
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.name | endswith(\"${JOB_NAME}\")) | \"\(.status) \(.conclusion)\"")

            if grep -qx 'completed success' <<<"$runs"; then
              echo "OK: the browser interaction suite passed at ${GITHUB_SHA}."
              exit 0
            fi

            # A job the `if:` in ci.yml skipped reports `completed skipped`, which
            # is correctly not a pass — that is this release run's own opted-out
            # copy, not evidence about the commit.
            if ! grep -qE '^(queued|in_progress)' <<<"$runs"; then
              break
            fi

            echo "attempt ${i}/${attempts}: still running, waiting 20s"
            echo "${runs}"
            sleep 20
          done

          echo "check runs matching '${JOB_NAME}' for ${GITHUB_SHA}:"
          echo "${runs:-  (none)}"
          echo
          echo "::error::No successful '${JOB_NAME}' run for ${GITHUB_SHA}. The" \
               "JavaScript and WGSL layer -- keydown handlers, picker-menu state" \
               "machine, preventDefault guards, brush, and every shader -- is" \
               "unverified at this commit, so the release is blocked. Get the commit" \
               "green on main or in a PR, then tag the NEXT version number: this tag" \
               "is immutable and its version is burned."
          exit 1

  build:
    name: Build sdist + wheel
    needs: [ci, browser-verified]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: no API token/secret. PyPI verifies the OIDC identity
    # of this workflow running in the `pypi` environment.
    environment:
      name: pypi
      url: https://pypi.org/project/polars2svg/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
