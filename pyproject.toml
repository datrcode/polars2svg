[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "polars2svg"
version         = "0.2.0"
authors         = [{ name = "D. Trimm", email = "dave.trimm+polars2svg@gmail.com" }]
description     = "Visualization Package Leveraging Polars and SVG in Jupyter Notebooks"
readme          = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
keywords        = ["polars", "svg", "visualization", "jupyter", "dataframe", "charts"]
# Lower bounds are recent, py3.12-compatible floors with headroom below the
# versions pinned in uv.lock (the known-good set). They guard against an install
# resolving an ancient release while staying wide enough to avoid downstream
# dependency conflicts. Exception: pillow's floor is security-driven, not a
# compatibility floor — 12.3 is the first release fixing PYSEC-2026-2253..2257,
# so it sits at the locked version with no headroom on purpose.
#
# Core is deliberately slim: xyp/histop/timep/piep/smallp/spreadlinesp only need
# polars + numpy (+ pyarrow/pillow/platformdirs for I/O). linkp's/chordp's
# pluggable-layout algorithms, the graph-layout mixin (treemaps, force-directed,
# neighborhood clustering, ...), and shapely-typed background= shapes all live
# behind the `layouts` extra instead — see p2s_graph_mixin.py / chordp.py /
# xyp.py / linkp.py, each of which guards its heavy import and raises a clear
# ImportError naming `polars2svg[layouts]` if the feature is actually used
# without it. Interactive variants (panelize/xypi/histopi/.../linkpi) similarly
# live behind `interactive`. `pip install polars2svg[all]` restores the
# previous "batteries included" install.
dependencies    = [
  "numpy>=1.26",
  "polars>=1.25",
  "pyarrow>=16",
  "pillow>=12.3",
  "platformdirs>=4.0",
]

classifiers=[
"Development Status :: 4 - Beta",
"Intended Audience :: Science/Research",
"Framework :: Jupyter",
"Programming Language :: Python :: 3",
"Programming Language :: Python :: 3.12",
"Programming Language :: Python :: 3.13",
"Operating System :: OS Independent",
"Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# TFDPLayout (tfdp_layout.py) — t-FDP force-directed graph layout on the MLX GPU.
# It also imports scipy/networkx/scikit-learn, so it chains `layouts`; without that
# chain `pip install polars2svg[mlx]` resolves but the module cannot import.
# ODFlowLayout (od_flow_layout.py) also uses this extra: it runs on NumPy by
# default and auto-uses the MLX GPU for its O(N^2) force kernels when present.
#
# `mlx` is a front-end that ships no backend library; the backend is a separate
# distribution selected by one of mlx's own extras. On macOS `mlx` depends on mlx-metal
# UNCONDITIONALLY (`platform_system == "Darwin"` in its metadata), which is why plain
# `mlx` works there and why nobody noticed. Everywhere else it pulls NOTHING: the extra
# installs and `import mlx.core` then fails with a missing libmlx.so. So Linux picks a
# backend explicitly — `mlx-cpu` here, or the CUDA pair below.
#
# Windows cannot be fixed from this file: mlx 0.32.2 publishes win_amd64/win_arm64
# FRONT-END wheels but gates every backend distribution to Linux or Darwin, so
# `polars2svg[mlx]` and `[all]` install there and TFDPLayout still cannot run. The
# ImportError in tfdp_layout.py says so rather than naming an extra that won't help.
#
# `all` deliberately chains plain `mlx` and NEVER a backend. Every backend ships the
# same `mlx/lib/libmlx.so`, so two in one environment is last-one-installed-wins with
# no warning from pip or uv (measured 2026-08-28: mlx-cpu's 20MB library overwrote
# mlx-cuda-13's 142MB one, leaving a CUDA install running on CPU). Chaining a backend
# into `all` would make the documented `polars2svg[all,mlx-cuda13]` a coin flip;
# chaining none keeps that combination exact. See PLANNING.md R6.
#
# MLX's CUDA backend is exposed here as the explicit `mlx-cuda`
# (CUDA 12) / `mlx-cuda13` (CUDA 13) extras — explicit because the CUDA wheels are
# Linux-only and must not be resolved on macOS. The same tfdp_layout.py code runs on
# every backend; only the device MLX binds to changes. All three Linux backend extras
# resolve to nothing on macOS (their marker excludes it), so `mlx` stays the macOS answer.
#
# The CUDA backend needs: NVIDIA SM >= 7.5 (Turing+), driver >= 550.54.14 (>= 580 for
# CUDA 13), CUDA toolkit >= 12.0, glibc >= 2.35, Linux x86_64/aarch64. There are no
# Windows CUDA wheels. Off that envelope MLX falls back to CPU (TFDPLayout still
# works, just slower) — see _default_device() in tfdp_layout.py.
mlx        = ["mlx", "polars2svg[layouts]"]
mlx-cpu    = ["mlx[cpu]; sys_platform == 'linux'", "polars2svg[layouts]"]
mlx-cuda   = ["mlx[cuda12]; sys_platform == 'linux'", "polars2svg[layouts]"]
mlx-cuda13 = ["mlx[cuda13]; sys_platform == 'linux'", "polars2svg[layouts]"]

# PNG export (component.save('x.png') / .savePNG()). Pillow is already a core
# dependency; svglib+reportlab do the SVG->PNG rasterization, rlPyCairo is the
# renderPM backend needed on Linux. Install with: pip install polars2svg[export]
#
# svglib is capped below 2.0: svglib 2.x applies CSS px->pt conversion to the
# SVG's width/height (200px -> 150pt), which at renderPM's default 72dpi shrinks
# every export to 0.75 scale and mis-scales nested <svg> tiles (smallp /
# spreadlinesp). svglib 1.x carries px straight through as points (1px -> 1px at
# 72dpi), which is the rasterization the PNG goldens are validated against. See
# svgToPNGBytes() in export.py. reportlab 5 is fine with svglib 1.x, so the
# floor stays open to it (reportlab>=4.0 now admits 5.0) — the cap is on svglib.
export = ["svglib>=1.5,<2", "reportlab>=4.0", "rlPyCairo>=0.3"]

# Graph-layout algorithms: linkp's/chordp's pluggable layouts, the graph-layout
# mixin (treemaps, force-directed, neighborhood clustering, ...), and shapely
# background= shapes on xyp/linkp. chordp's node-ordering is core to every
# chord render, so chordp effectively requires this extra. Install with:
# pip install polars2svg[layouts]
layouts = ["networkx>=3.2", "scikit-learn>=1.5", "scipy>=1.13", "shapely>=2.0", "squarify>=0.4.4"]

# Interactive, cross-linked variants (panelize/xypi/histopi/timepi/linkpi/smallpi)
# built on Panel. Includes `layouts`: interactive_controller.py's graph views
# (linkpi's layout switcher, MDS/force-directed re-layout on selection) need
# networkx/scipy/scikit-learn the same as the static components do. pyperclip
# backs linkpi's ctrl-C copy-selection-to-clipboard; it's a top-level import
# in interactive_controller.py, same as panel/param, since that module is only
# ever loaded via this extra. Install with: pip install polars2svg[interactive]
interactive = ["panel>=1.5", "jupyter_bokeh>=4.0", "param>=2.0", "pyperclip>=1.9", "polars2svg[layouts]"]

# Union of every extra — restores the pre-extras "batteries included" install.
# Chains plain `mlx`, not `mlx-cuda`: `all` has to stay installable on macOS, and the
# CUDA wheels are Linux-only. NVIDIA users add it explicitly: polars2svg[all,mlx-cuda]
# Consequence of the plain-`mlx` chain, and deliberate (see the mlx comment above): on
# Linux `all` installs no usable mlx backend by itself. Combine it with exactly one
# backend extra — polars2svg[all,mlx-cpu] or polars2svg[all,mlx-cuda13] — never two.
all = ["polars2svg[interactive,layouts,export,mlx]"]

# Dev/test-only tooling (PEP 735). Not published to wheel METADATA.
# Install with: uv pip install -e . --group dev   (or `uv sync`, which includes it by default)
# svglib rasterization needs reportlab at use-time — keep them together here.
# Includes every optional extra (layouts, interactive, export) so the full test
# suite — which exercises linkp/chordp/interactive variants — runs unmodified.
[dependency-groups]
dev = [
  "pytest",
  "coverage",
  "fonttools",  # build-time tool for tools/gen_font_metrics.py; here so
                # tests/test_font_metrics_consistency.py can re-derive the baked
                # metrics from the bundled TTF and catch a stale generated table
                # (it skips, rather than fails, where fontTools is absent)
  "ipykernel",
  "kagglehub",
  "svglib<2",   # capped for the same reason as the [export] extra: svglib 2's
                # px->pt conversion shrinks PNG output and breaks nested-<svg>
                # goldens. Keeps local test runs on the tested rasterization path.
  "reportlab",
  "rlPyCairo",  # reportlab 5.x renderPM backend (Linux); rasterizes SVG->PNG in golden tests
  "networkx>=3.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "shapely>=2.0",
  "squarify>=0.4.4",
  "panel>=1.5",
  "jupyter_bokeh>=4.0",
  "param>=2.0",
  "pyperclip>=1.9",
]

[project.urls]
Homepage   = "https://github.com/datrcode/polars2svg"
Repository = "https://github.com/datrcode/polars2svg"

[tool.pytest.ini_options]
testpaths = ["tests"]

# polars2svg ships a py.typed marker so downstream type checkers read the type
# hints the package carries.  The public surface (Polars2SVG.__init__, the component
# factory methods, tField, panelize, the exported layout classes) has always been
# annotated; as of 2026-09-02 the internals are being annotated too, module by
# module, and new code is expected to arrive fully typed.
#
# THE DIRECTION HAS CHANGED.  This block used to say the internals were dynamically
# typed on purpose and that annotating them would be "boiling the ocean".  That
# stance was retired after an audit: with the setattr()-bound attribute surface
# simply *declared* (see the enum block in polars2svg.py and the per-component
# blocks that follow it), 72% of what mypy reports on this package evaporates
# without a single function signature changing.  The ocean turned out to be a pond.
#
# How the migration runs:
#
#   - The settings below are the FLOOR -- what every module must satisfy today.
#     They stay permissive so the tree is always green.
#   - A module that has been fully annotated graduates into the [[tool.mypy.overrides]]
#     ratchet at the bottom of this file, which holds it to strict checking and
#     re-enables the error codes disabled here.  Modules are added to that list;
#     they are never removed from it.
#   - tests/test_typing_surface.py enforces the same ratchet from the test suite,
#     so annotation coverage cannot regress even where mypy is not run.
#
# When the ratchet list covers every module, these disables and this comment go
# away and the settings move up into the global block.  Until then: do not weaken
# an annotation to satisfy this config, and do not add a module to the ratchet
# without running `uvx mypy polars2svg` first.
[tool.mypy]
ignore_missing_imports = true
# Disabled only for modules that have not yet graduated to the ratchet below.
# Each entry is a dynamic idiom that the annotation work removes module by module;
# the goal is an empty list.  `index` and `func-returns-value` were dropped on
# 2026-09-02 after measuring zero occurrences of either.
disable_error_code = [
  "attr-defined",       # instance attrs bound via setattr(); being replaced by declaration blocks
  "var-annotated",      # untyped module/class-level containers built imperatively
  "assignment",         # narrowing reassignments in polars expression building
  "has-type",           # forward-referenced attrs set across mixins
  "misc",               # dynamic base/enum construction
  "dict-item",          # heterogeneous wrapper-dispatch tables
  "return-value",       # helpers that return polars Collections typed as dict
]

# --- The typing ratchet ------------------------------------------------------
# Modules that have been fully annotated graduate to this list and are then held
# to strict checking, with every error code disabled above re-enabled for them.
#
# Annotating a module and promoting it here are TWO steps, and the second is the
# expensive one.  Annotating gets its ceiling in tests/test_typing_surface.py to
# zero; promotion additionally turns on check_untyped_defs and the strict error
# codes, which reaches every local and attribute in the module and reliably turns
# up latent findings (the first three modules cost five real fixes; wave A's
# twelve cost thirty-five).  So a module can be fully annotated and legitimately
# not yet listed here -- as seven of wave B's mixins are.
#
# NEVER remove a module from this list: one that has to come off is a regression,
# not a config change.  Run `uvx mypy polars2svg` before adding.
#
# When every module is listed, delete this section and move the settings into
# [tool.mypy] above.  Progress is also asserted from the test suite --
# see tests/test_typing_surface.py::TestAnnotationCoverageRatchet.
[[tool.mypy.overrides]]
module = [
  # wave A (leaf modules), 2026-09-02
  "polars2svg._seriation",
  "polars2svg.exceptions",
  "polars2svg.circle_packer",
  "polars2svg.export",
  "polars2svg.interactive_treatments",
  "polars2svg.laguerre_voronoi",
  "polars2svg.layout_budget",
  "polars2svg.layout_protocol",
  "polars2svg.mds_at_scale",
  "polars2svg.p2s_bin_component_mixin",
  "polars2svg.p2s_font_metrics",
  "polars2svg.p2s_glyph_atlas",
  "polars2svg.p2s_polars_mixin",
  "polars2svg.p2s_webgpu_runtime",
  "polars2svg.tfdp_layout",
  "polars2svg.tile",
  # wave B (mixins) -- the three that were strict-clean on arrival
  "polars2svg.p2s_background_mixin",
  "polars2svg.p2s_render_mixin",
  "polars2svg.p2s_time_mixin",
  # wave C (core + layouts), 2026-09-02 -- all five promoted
  "polars2svg.flow_field_background",
  "polars2svg.ncp_layout",
  "polars2svg.od_flow_layout",
  "polars2svg.polars2svg",
  "polars2svg.udist_scatterplots_via_sectors_tile_opt",
  # wave D (components), 2026-09-03 -- the three that were strict-clean on arrival.
  # xyp / linkp / chordp / piep / spreadlinesp are fully annotated but not yet
  # promoted: 19 errors between them, mostly return types that need widening plus
  # the caller guards that widening then demands.
  "polars2svg.histop",
  "polars2svg.smallp",
  "polars2svg.timep",
  # wave E (interactive), 2026-09-03 -- all three in scope; see the note below
  # about interactive_controller, which is deliberately not one of them.
  "polars2svg.p2s_interactive_mixin",
  "polars2svg.spreadlinepi",
  "polars2svg.stack_control",
]

# --- interactive_controller.py: permanently relaxed --------------------------
# The one module the annotation migration deliberately does not cover, decided
# 2026-09-03 rather than deferred:
#
#   - It builds its widget classes at runtime with `type('LINKPI', (ReactiveHTML,),
#     {...})`, so the classes a checker would need to reason about do not exist
#     until the call runs.
#   - Its state lives in Panel/param descriptors, which resolve dynamically.
#   - It sits behind the `interactive` extra, so it is absent from a default
#     `pip install polars2svg` and invisible to the public typed surface.
#
# Annotating it would mean a wall of `Any` and `type: ignore` for no checkable
# benefit. Its 145 functions are excluded from the coverage target (see
# TestAnnotationCoverageRatchet.PERMANENTLY_RELAXED); its ceiling still holds, so
# the file cannot get *worse*, and new code in it is still expected to be typed.
disallow_untyped_defs    = true
disallow_incomplete_defs = true
check_untyped_defs       = true
enable_error_code = [
  "attr-defined", "var-annotated", "assignment",
  "has-type", "misc", "dict-item", "return-value",
]

# Minimal rule set (PyPI nice-to-have #5): E9 (syntax errors) and F (pyflakes —
# undefined names, unused imports/variables, duplicate dict keys, ...). This
# codebase has a distinctive style (aligned assignments, _underscore_ locals,
# dynamic setattr()-bound enums) that stricter rulesets (style/import-sorting/
# complexity) would fight, so the wider rule catalog is deliberately not
# enabled here.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API (Polars2SVGError, TField, the optional
# layout classes, ...) purely for `import polars2svg as p2s; p2s.X` access —
# every name is intentionally "unused" within the file itself.
"polars2svg/__init__.py" = ["F401"]

[tool.coverage.run]
branch = true
command_line = "-m unittest discover -s tests/"
source = ["."]

[tool.hatch.build.targets.wheel]
packages = ["polars2svg"]

# Excludes working docs/tooling files that don't belong in a source release.
# README.md/LICENSE are included regardless (hatchling always ships files
# referenced by the readme/license metadata) — verified by inspecting the
# built sdist.
[tool.hatch.build.targets.sdist]
exclude = [
  "notebooks/",
  "uv.lock",
  ".python-version",
  "pypi_instructions.txt",
  "CLAUDE.md",
  "PLANNING.md",
  "20260824_background_record_contract.md",
]
