name: CI

# Clean-room install verification on Linux (PyPI must-do #9).
# Every prior test run was macOS/arm64; this exercises the built wheel on
# linux/amd64 inside a stock python:3.13-slim image — a genuine clean room
# (no preinstalled project deps, no system Python packages) — to catch
# platform-dependent path handling, the mlx import guard, and font-metric
# non-determinism in the golden-image tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml invoke this same suite as a pre-publish gate, so the tests
  # that guard a release are literally the tests that run on every commit — not
  # a second copy that can drift. Tag pushes do not match `branches: [main]`
  # above, so without this the tagged commit would otherwise never be tested.
  workflow_call:

jobs:
  # Type-check the public surface (PyPI nice-to-have #1). The package ships a
  # py.typed marker, so downstream checkers read our hints; this guards that the
  # public signatures stay valid.
  #
  # This job used to run `uvx mypy polars2svg` with nothing installed, and that
  # check was vacuous. uvx resolves into an isolated environment, so polars,
  # numpy and PIL were absent; `ignore_missing_imports = true` turned every one
  # of them into Any, and every operation on a DataFrame, Series or ndarray
  # type-checked trivially. On 2026-09-13 it printed "Success: no issues found in
  # 47 source files" while the same config resolved against a real environment
  # found 730 errors in 17 files (104 after Q4's boundary narrowings).
  #
  # The extras are load-bearing, not belt-and-braces: with base dependencies
  # alone the count is 724 in 14 files, because export.py, p2s_reactive_base.py
  # and the colour/atlas helpers only resolve once svglib, param and friends are
  # installed. They are named one by one rather than --all-extras for the same
  # reason pip-audit names them below: --all-extras pulls mlx-cuda's Linux-only
  # NVIDIA wheels onto this runner.
  type-check:
    name: mypy (public surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install the project, its extras and the dev group
        # The dev group pins mypy (>=2.3,<2.4), so uv.lock decides the version
        # this job runs. `uvx mypy` resolved whatever was newest that morning --
        # the local .ruff_cache had collected nine ruff versions the same way.
        run: uv sync --extra layouts --extra interactive --extra export --group dev

      - name: Run mypy against a ceiling
        # 60 errors stand today and are burned down by module; until that
        # finishes a plain pass/fail gate would be permanently red, and a gate
        # that is always red is one people learn to ignore. So: green at or
        # below the ceiling, red above it. That is enough to catch the drift
        # that motivated the change (the count moved 725 -> 729 over three
        # commits in a single day, with this job green throughout).
        #
        # Keep this number equal to _MYPY_CEILING_ in tools/preflight.sh and to
        # the sum of MAX_ERRORS in tests/test_typing_surface.py, which splits the
        # same total by module and is checked by the suite.
        #
        # The count is a function of the dependency versions as well as the
        # code, so it only means something against a stated environment. This
        # one is uv.lock's: polars 1.41.2, numpy 2.4.6, mypy 2.3.1, the three
        # extras above, no mlx. A .venv built ad-hoc with `uv pip install -e .`
        # drifts ahead of the lock and reports a different number -- which is why `uv sync` is
        # the install step here and why preflight's number matches only while a
        # local .venv is lock-aligned. A polars bump moving this is a deliberate
        # re-baseline, not a regression; name the new version when you raise it.
        run: |
          _CEILING_=60
          set +e
          _out_="$(uv run mypy polars2svg 2>&1)"; _rc_=$?
          set -e
          # mypy exits 0 clean, 1 with findings, >=2 on a crash or bad config.
          # Without this guard a broken run emits no ': error: ' lines, counts
          # zero, and reports a false green -- which is the exact failure mode
          # this job is being changed to correct.
          if [ "$_rc_" -gt 1 ]; then
              printf '%s\n' "$_out_"
              echo "::error::mypy did not run (exit $_rc_)"
              exit 1
          fi
          _n_="$(printf '%s\n' "$_out_" | grep -c ': error: ' || true)"
          if [ "$_n_" -gt "$_CEILING_" ]; then
              printf '%s\n' "$_out_" | grep ': error: '
              echo "::error::mypy reports $_n_ errors, ceiling is $_CEILING_"
              exit 1
          fi
          if [ "$_n_" -lt "$_CEILING_" ]; then
              echo "::warning::mypy reports $_n_ errors; lower the ceiling here and in tools/preflight.sh to $_n_"
          fi
          echo "mypy: $_n_ errors (ceiling $_CEILING_)"

  # Security/quality automation (PyPI nice-to-have #5).
  security-and-quality:
    name: bandit + pip-audit + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Install the project, its extras and the dev group
        # ruff is pinned in the dev group, so uv.lock decides the version this job
        # runs.  bandit and pip-audit below are still `uvx` and still unpinned --
        # they read the repo and an exported requirements file, not the venv.
        run: uv sync --extra layouts --extra interactive --extra export --group dev

      - name: bandit (static security scan)
        # Findings are either fixed or annotated in-line with a justified
        # `# nosec <code> - <reason>` (see SECURITY.md's threat model for why
        # e.g. random.randint()-based SVG id scoping and the background=
        # shape-descriptor XML parsing are not vulnerabilities here). A clean
        # run means every remaining flag has been reviewed and accepted.
        run: uvx bandit -r polars2svg/

      - name: pip-audit (known-vulnerable dependency scan)
        # Audits the locked resolution of the package plus every extra a user
        # can actually install. The three are named explicitly rather than
        # --all-extras, which would add mlx-cuda/mlx-cuda13: their Linux-only
        # NVIDIA wheels are kept out of `all` on purpose (see
        # [project.optional-dependencies]), resolve to a no-op on macOS, and
        # pull the whole CUDA stack onto this runner.
        #
        # The extras are the point. Without them this exported six packages —
        # numpy, pillow, platformdirs, polars, polars-runtime-32, pyarrow — and
        # said nothing about panel, bokeh, lxml, requests, urllib3, jinja2,
        # tornado, reportlab or scikit-learn, which is where dependency
        # advisories actually land. With them it audits 77. It ran blind past
        # three tornado advisories (PYSEC-2026-3928, GHSA-wwv5-g3v4-889x,
        # GHSA-8423-8fgw-73vq) that the first run with extras caught at once.
        #
        # "Locked", not "published": uv export reads uv.lock, so this is the
        # pinned resolution rather than what a fresh `pip install polars2svg`
        # gives a user. The two drift — that tornado pin was stale while a fresh
        # resolve already had the fix — so a finding here means "our lock is
        # behind", which is worth fixing but is not the same as a shipped
        # vulnerability.
        #
        # --no-deps AND --disable-pip, and it takes both. pip-audit's default path for
        # a requirements file is to shell out to
        # `pip install --dry-run --report -r ...` inside a throwaway virtualenv, and
        # --dry-run still builds an sdist to read its metadata. `export` brings
        # rlPyCairo -> pycairo, which publishes no Linux wheel, so that build wants
        # cairo's headers -- which this job does not carry (the clean-room job
        # installs libcairo2-dev; this one had never needed a toolchain). It failed as
        # `Dependency "cairo" not found` on all three attempts, which reads like a
        # flaky network and is a compile.
        #
        # --no-deps alone does NOT avoid that: it skips dependency *resolution* while
        # still invoking pip. --disable-pip is the flag that keeps pip out entirely,
        # and it is only accepted alongside --no-deps or a hashed file. With both,
        # nothing is installed and nothing is built, so no system library can be
        # missing -- the step is a lookup of pinned names against the advisory
        # database and takes ~2s instead of ~60s.
        #
        # Coverage is unchanged and was checked rather than assumed: 75 packages
        # audited (the two short of the file are Windows/emscripten-marker-only),
        # pycairo, lxml, tornado, urllib3, reportlab and svglib among them, and a
        # vulnerable pin is still reported -- verified against tornado 6.5.7's three
        # advisories. pip-audit warns it would rather have hashes; that is expected,
        # and uv.lock is what pins us here.
        #
        # Retried because this is the one check in this job whose result is not
        # a property of the repo: pip-audit queries pypi.org's JSON API once per
        # dependency, so a stalled TLS handshake fails the build even though
        # nothing changed. Two specific upstream gaps make that fatal rather
        # than merely slow -- pip-audit's PyPIService.query() catches
        # ConnectTimeout but *not* ReadTimeout (so a connect stall that urllib3
        # retries into the read path escapes as an unhandled traceback), and its
        # caching_session() mounts no urllib3 Retry. Run 30093136029 died that
        # way on the first of only six packages, while the clean-room job pulled
        # from PyPI successfully in the same 21-second window.
        #
        # A real finding still fails the build: pip-audit exits non-zero for
        # those on attempt 1, and the retries reproduce it deterministically.
        run: |
          uv export --no-hashes --no-dev --no-emit-project \
              --extra interactive --extra layouts --extra export \
              -o /tmp/requirements-audit.txt
          for _attempt_ in 1 2 3; do
              uvx pip-audit --no-deps --disable-pip --timeout 30 -r /tmp/requirements-audit.txt && exit 0
              if [ "$_attempt_" -lt 3 ]; then
                  echo "::warning::pip-audit attempt $_attempt_ failed; retrying in $((_attempt_ * 10))s"
                  sleep $((_attempt_ * 10))
              fi
          done
          echo "::error::pip-audit failed 3 consecutive attempts"
          exit 1

      - name: ruff
        # Narrow rule set on purpose, and what is left out is as deliberate as what
        # is in — see the [tool.ruff] comment in pyproject.toml.
        #
        # Scope is the whole tree as of 2026-09-14, not polars2svg/ alone.  tests/
        # had never been linted by CI or preflight and held 106 E9/F findings,
        # including an F821 (an undefined name) that sat behind `if False` in the
        # opt-in interaction suite, where no test run would reach it either.
        run: uv run ruff check .

  linux-cleanroom:
    name: Linux clean-room wheel install + tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # 3.14 added 2026-09-14 alongside the `Programming Language :: Python :: 3.14`
    # classifier, and deliberately in the same change: the classifier is a claim of
    # support, and this leg is what keeps the claim true.  requires-python has
    # admitted 3.14 since it shipped, so users were installing there either way --
    # the only question was whether anything checked.
    #
    # The floor and the ceiling of requires-python, not every version between: 3.12
    # is what the metadata promises and 3.14 is the newest CPython, so a break at
    # either end shows up.  fail-fast is off so a 3.14 failure does not cancel the
    # 3.13 leg and hide whether the break is version-specific.
    #
    # Verified locally on 3.14.5 before this was added (macOS/arm64: the full suite
    # and the 219-test interaction suite both green).  That is a different platform
    # from this job, which is the point of the job.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    container: python:${{ matrix.python }}-slim
    steps:
      # git lets actions/checkout use a fast clone instead of the REST tarball.
      # The rest are pycairo's build dependencies: pycairo publishes Windows-only
      # wheels, so on Linux the rlPyCairo -> pycairo chain compiles from the sdist
      # and needs a C toolchain plus cairo's headers. slim ships neither.
      - name: Install git and pycairo's build dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git build-essential libcairo2-dev pkg-config

      - uses: actions/checkout@v7

      - name: Build the wheel
        run: |
          pip install --no-cache-dir uv
          uv build

      - name: Install the built wheel into a clean environment
        run: pip install --no-cache-dir dist/*.whl

      - name: Import smoke test
        run: python -c "import polars2svg; print('import ok')"

      - name: Install test-only dependencies
        # The bare wheel above proves `pip install polars2svg` imports; the suite
        # itself needs more. Resolve the extras through the wheel rather than
        # re-listing their contents here — a hand-kept list silently drifts from
        # [project.optional-dependencies] (it had already lost scipy, networkx,
        # shapely and param, which is 15 collection errors and zero tests run).
        # These three are the extras the suite needs.  ([dependency-groups] dev used
        # to re-list their contents too; that duplication was removed 2026-09-14
        # because the two copies had drifted, so dev is test-only tooling now and
        # the extras are named at install time -- here and in CONTRIBUTING.md.)
        # mlx is deliberately absent: the suite is meant to run without it, which is
        # what exercises tfdp_layout.py's import guard.
        #
        # export brings svglib+reportlab+rlPyCairo. rlPyCairo is reportlab 5.x's
        # renderPM backend on Linux (macOS has its own); without it svglib
        # rasterization errors out. The PNG-RMS golden tests skip off macOS
        # regardless, but the backend is needed for any that force-run.
        #
        # fonttools is hand-listed for the same reason it isn't in an extra: it
        # is build-time-only (it backs tools/gen_font_metrics.py), so there is no
        # runtime extra to resolve it through, and [dependency-groups] dev —
        # where it is declared — isn't published to wheel METADATA, which is what
        # this job installs from. Without it the six tests in
        # test_font_metrics_consistency.py's TestGeneratedTableMatchesTheFont
        # skip silently, and the check that re-derives ADVANCES/INK_EXTENTS from
        # the bundled TTF never runs — so "regenerate the metrics after changing
        # the font" goes back to being remembered rather than enforced.
        run: |
          pip install --no-cache-dir "$(echo dist/*.whl)[interactive,layouts,export]"
          pip install --no-cache-dir pytest kagglehub fonttools

      - name: Run the test suite
        # test_performance.py needs a machine-local baseline, so it stays out
        # (must-do #9).
        #
        # There is no -k filter, and there should not be one. `-k 'not tfield'`
        # was here to skip the Kaggle-backed t-field test, but -k matches node
        # ids rather than files: it deselected 61 tests across nine files
        # (test_tfield_typed.py, test_p2s_tfields.py, test_p2s.py,
        # test_timep_basic.py, test_smallp_validation.py and three others) to
        # exclude the ONE test that needs the network. Only test_xyp_tfields.py
        # imports kagglehub, and only test_example_globalTemperatures within it
        # reaches Kaggle — test_exhaustive alongside it is offline.
        #
        # That one test RUNS here rather than skipping: kagglehub is installed
        # in the step above, and berkeleyearth/climate-change-earth-surface-
        # temperature-data is a public dataset, so dataset_download succeeds
        # anonymously with no Kaggle credentials configured on the runner. This
        # job really does pull that dataset on every run. That is intentional
        # — it is the only t-field coverage against a real-world CSV rather
        # than a hand-built or randomDataFrame() frame — so keep it running.
        #
        # Its two guards are the fallback path, not the normal one:
        # @unittest.skipUnless on the kagglehub import, then self.skipTest()
        # when dataset_download raises. A Kaggle outage, a rate limit, or a
        # future credential requirement therefore degrades this to a skip
        # instead of a red build. Do not read that as the expected outcome: on
        # a healthy run the test executes for real.
        #
        # -rs for the reason the browser job gives below, plus one specific to
        # that fallback — it is silent, so without -rs a Kaggle outage would
        # stop exercising this test with nothing in the log to say so.
        run: python -m pytest tests/ -q -rs --ignore=tests/test_performance.py

  # The browser-driven interaction suite (tests/interaction/, PLANNING.md 2.1).
  #
  # Everything it covers is JavaScript that no Python test can reach: the keydown
  # handlers, the picker-menu state machine, the preventDefault guards, the brush,
  # and the WGSL shaders. It found ten defects during development, seven of which
  # were invisible to the rest of the suite. Until now it had never run anywhere
  # except by hand.
  browser-interaction:
    name: Browser interaction suite (Playwright)
    runs-on: ubuntu-latest

    # Deliberately NOT the python:3.13-slim container the clean-room job uses.
    # Chromium needs a system library stack that image does not carry, and that
    # job exists to prove the built *wheel* installs — driving a browser inside it
    # would blur what a failure there means.
    #
    # Skipped on tag builds. release.yml gates a publish by calling this whole
    # workflow (`uses: ./.github/workflows/ci.yml`) from a `v*` tag push, and a
    # published version is burned forever — so until this suite has a track record
    # on a GitHub runner, a flaky browser test must not be able to block, or worse
    # wave through, a release. `github.ref_type` rather than `github.event_name`:
    # a called workflow inherits the *caller's* event, so event_name is never
    # "workflow_call" and gating on it silently does nothing.
    #
    # This does NOT mean a release can ship JavaScript that was never exercised.
    # release.yml's `browser-verified` job requires the tagged commit to already
    # carry a green check run from this job — it verifies rather than re-runs, so
    # the coverage is real while a flaky browser test still cannot burn an
    # immutable version number. The case it refuses outright is a tag on a commit
    # that never reached main or a PR, which is the only way the JS/WGSL layer
    # could otherwise go out unverified.
    #
    # Promote this suite into the gate for real by deleting the line below, once
    # it has been green here for long enough to trust. `browser-verified` keeps
    # working unchanged either way: it matches the check-run name by *suffix*,
    # which also catches the `CI gate / …` prefix a workflow_call adds.
    if: github.ref_type != 'tag'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the package and the suite's dependencies
        # Resolved through the project rather than re-listed, for the reason the
        # clean-room job spells out: a hand-kept list drifts from
        # [project.optional-dependencies] and the drift shows up as collection
        # errors, not as a missing package.
        #
        # `export` is deliberately absent. It is the svglib/reportlab/rlPyCairo
        # rasterization chain, which nothing here uses — and on Linux pycairo
        # compiles from sdist, so pulling it in would mean a C toolchain and
        # cairo's headers for no coverage. Pillow, which the WebGPU pixel
        # assertions do need, is a *core* dependency and arrives regardless; if
        # that ever changes, test_webgpu_render.py's `importorskip('PIL')` would
        # skip all 16 of its tests silently rather than failing.
        #
        # pytest-playwright is named explicitly because it is deliberately not in
        # [dependency-groups] dev — the browser tooling stays opt-in for local
        # work, so `uv sync` installs nothing new.
        run: |
          pip install --no-cache-dir ".[interactive,layouts]"
          pip install --no-cache-dir pytest pytest-playwright

      - name: Install chromium
        # --with-deps pulls the shared libraries chromium needs on a bare runner.
        # This installs both the full `chromium` build and `chromium-headless-shell`;
        # the WebGPU tests need the former (`channel='chromium'`), because
        # headless-shell exposes navigator.gpu but returns a null adapter, which
        # would make every GPU test skip for a reason that looks like hardware.
        run: python -m playwright install --with-deps chromium

      - name: Run the interaction suite
        # --interaction is the opt-in gate; without it every test here skips, which
        # is why `pytest tests/` in the clean-room job above stays unaffected.
        #
        # No Xvfb, on purpose, and it costs exactly three tests. The clipboard
        # round-trips need a display and a selection owner and will skip. Adding
        # Xvfb to recover them would *lose* the 14 WebGPU tests instead: the
        # webgpu_browser fixture reads DISPLAY as "there is a real GPU here" and
        # switches to `--use-vulkan=native`, which finds no adapter on a runner.
        # Without DISPLAY it takes the headless SwiftShader path, which works. The
        # real fix is for that fixture to try native and fall back rather than
        # branching on DISPLAY; until it does, this trade buys 14 tests for 3.
        #
        # -rs prints the reason for every skip. Without it the log says only
        # "N skipped", and this suite skips for two quite different reasons -- a
        # runner with no usable GPU canvas, and no clipboard on a headless box --
        # which a bare count cannot tell apart from a fixture quietly breaking and
        # taking tests with it. Green at the wrong number is the exact failure mode
        # these tests exist to catch, so the reasons belong in the log.
        run: python -m pytest tests/interaction --interaction -q -rs
