# Build the mkdocs site and deploy it to GitHub Pages.
#
# The site builds from static, committed content (the example SVGs are
# generated locally by docs/gen_examples.py) plus the mkdocstrings API page
# (docs/api.md), so this job does not need polars2svg installed. mkdocstrings'
# python handler reads the source with griffe — static analysis, no import — and
# finds polars2svg/ because it sits beside mkdocs.yml. That is why the install
# below is the two doc tools and nothing else: adding the package or its runtime
# dependencies here would change nothing about the output.
#
# Requires: repo Settings → Pages → Source = "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install docs tooling
        run: pip install --no-cache-dir mkdocs-material "mkdocstrings[python]"
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
