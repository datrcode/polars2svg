site_name: polars2svg
site_description: Polars-native DataFrame → SVG visualizations for Jupyter
site_url: https://datrcode.github.io/polars2svg/
repo_url: https://github.com/datrcode/polars2svg
repo_name: datrcode/polars2svg

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.integrate

# `search` has to be listed explicitly: declaring `plugins:` at all replaces the
# default plugin list, so omitting it silently removes site search.
#
# mkdocstrings' python handler reads the source with griffe (static analysis) — it
# never imports polars2svg, so this build needs neither the package installed nor any
# of its runtime dependencies, and the docs.yml job installs only the two doc tools.
# The source is found because polars2svg/ sits beside this file, which is griffe's
# default search path; no `paths:` entry is needed. A consequence worth knowing: the
# API page documents the conditionally-imported layout classes even though a core
# install doesn't provide them at runtime — docs/api.md says so under Layouts.
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            members_order: source
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Components:
      - Gallery: components/index.md
      - xyp — scatter: components/xyp.md
      - histop — histogram: components/histop.md
      - timep — temporal bars: components/timep.md
      - piep — pie / donut: components/piep.md
      - linkp — network: components/linkp.md
      - chordp — chord diagram: components/chordp.md
      - spreadlinesp — spread lines: components/spreadlinesp.md
      - smallp — small multiples: components/smallp.md
  - API reference: api.md
  - Guides:
      - count= and color=: guides/count-color.md
      - Time fields (t-fields): guides/t-fields.md
      - Interactivity: guides/interactivity.md

exclude_docs: |
  gen_examples.py
  __pycache__/
